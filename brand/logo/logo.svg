<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0c1a2b"/><stop offset="1" stop-color="#04070c"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cd3ff"/><stop offset=".55" stop-color="#b48cff"/><stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cd3ff" stop-opacity=".30"/><stop offset="1" stop-color="#5cd3ff" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe2a8"/><stop offset=".35" stop-color="#ffc46b"/><stop offset="1" stop-color="#ffc46b" stop-opacity="0"/></radialGradient>
    <clipPath id="inner"><circle cx="256" cy="256" r="178"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 24 h dial: faint track + day arc -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#5cd3ff" stroke-opacity=".12" stroke-width="16"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="1047 1257" transform="rotate(-90 256 256)"/>
  <!-- body -->
  <g clip-path="url(#inner)">
    <path d="M150 440 C150 318 182 262 256 262 C330 262 362 318 362 440 Z" fill="url(#body)" stroke="#5cd3ff" stroke-opacity=".85" stroke-width="5"/>
    <circle cx="256" cy="186" r="50" fill="url(#body)" stroke="#5cd3ff" stroke-opacity=".85" stroke-width="5"/>
    <!-- the food's path -->
    <path d="M256 214 L256 300 C256 322 292 318 290 344" fill="none" stroke="#ffc46b" stroke-opacity=".75" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 11"/>
  </g>
  <circle cx="290" cy="348" r="34" fill="url(#glow)"/>
  <circle cx="290" cy="348" r="11" fill="#fff4dc"/>
</svg>
