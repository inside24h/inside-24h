# Audit C14 (2026-11-12): every push / pull request runs the type check, the fast test tier (~1 min) and the
# single-file v4 build. The full test tier (all sweeps, > 10 min) runs nightly and on demand: test-full.yml.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests (fast tier)
        run: npm run test:fast
      - name: Build v4 (single file)
        run: npx vite build --config vite.v4.config.ts
      - name: Committed site/ - every asset reference resolves
        run: node scripts/check-site.mjs
      - name: Build site (split) and check it the same way
        run: |
          npx vite build --config vite.site.config.ts
          node scripts/make-site-split.mjs
          node scripts/check-site.mjs
