# Audit C14 (2026-11-12): the full test tier (every sweep over the whole food database, > 10 min, ~2.2 GB RAM).
# Nightly and on demand (Actions -> "Tests (full)" -> Run workflow). The fast tier runs on every push: ci.yml.
name: Tests (full)
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    # Phase 4i: four runners in parallel, each a share of the files of about the same total time
    # (vitest.full.config.ts, vitest.shard-sequencer.ts); every test file runs in exactly one shard.
    name: full (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tests (full tier)
        run: npm run test:full -- --shard=${{ matrix.shard }}/4
        env:
          NODE_OPTIONS: --max-old-space-size=6144
